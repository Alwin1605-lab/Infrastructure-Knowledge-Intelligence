# =========================================
#  Infrastructure Knowledge Intelligence
#  Docker Compose - Full Stack
# =========================================
#
# Usage:
#   docker-compose up -d --build  # Build and start all services
#   docker-compose down           # Stop all services
#   docker-compose down -v        # Stop and remove volumes (DELETES DATA)
# =========================================

version: "3.8"

services:
  # --- Frontend (React / Vite / Nginx) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: infra_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - infra_network

  # --- Backend (FastAPI) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infra_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - NEO4J_URI=bolt://neo4j:7687
      - CHROMADB_HOST=chromadb
      - APP_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      chromadb:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/system"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - infra_network

  # --- MongoDB (Document Store) ---
  mongodb:
    image: mongo:7
    container_name: infra_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-infra_knowledge}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - infra_network

  # --- Neo4j (Knowledge Graph) ---
  neo4j:
    image: neo4j:5
    container_name: infra_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP (Browser UI)
      - "7687:7687"   # Bolt (Driver protocol)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - infra_network

  # --- ChromaDB (Vector Store) ---
  chromadb:
    image: chromadb/chroma:latest
    container_name: infra_chromadb
    restart: unless-stopped
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    networks:
      - infra_network

# --- Named Volumes ---
volumes:
  mongodb_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  chromadb_data:
    driver: local
  uploads_data:
    driver: local

# --- Networks ---
networks:
  infra_network:
    driver: bridge
